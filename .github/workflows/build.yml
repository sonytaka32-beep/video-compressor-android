name: Android Release APK CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          # Install Android SDK from scratch
          sudo apt-get update -qq
          sudo apt-get install -qq -y unzip wget python3
          
          # Download and install cmdline-tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # Add to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006"

      - name: Cache Gradle packages and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Download & Verify Prebuilt FFmpegKit Full-GPL AAR (with Native .so)
        run: |
          mkdir -p app/libs

          # 1. Download smart-exception dependencies required by FFmpegKitConfig at runtime
          curl -fL "https://repo1.maven.org/maven2/com/arthenica/smart-exception-common/0.2.1/smart-exception-common-0.2.1.jar" \
            -o app/libs/smart-exception-common-0.2.1.jar
          curl -fL "https://repo1.maven.org/maven2/com/arthenica/smart-exception-java/0.2.1/smart-exception-java-0.2.1.jar" \
            -o app/libs/smart-exception-java-0.2.1.jar

          # 2. Check if cached AAR already exists and contains native .so libraries
          if [ -f "app/libs/ffmpeg-kit-full-gpl.aar" ] && unzip -l app/libs/ffmpeg-kit-full-gpl.aar | grep -q "libffmpegkit.so"; then
            echo "Valid cached ffmpeg-kit-full-gpl.aar found."
            exit 0
          fi

          # 3. Build candidate URL list (Maven Central + Dynamic Search + Web Archive mirrors)
          python3 - << 'EOF'
          import json, os, subprocess, urllib.request

          urls = [
              "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-full-gpl/6.0-2/ffmpeg-kit-full-gpl-6.0-2.aar",
              "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-full-gpl/6.0-2.LTS/ffmpeg-kit-full-gpl-6.0-2.LTS.aar",
              "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-full-gpl/6.0/ffmpeg-kit-full-gpl-6.0.aar",
              "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-full-gpl/5.1.LTS/ffmpeg-kit-full-gpl-5.1.LTS.aar",
              "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-full-gpl/5.1/ffmpeg-kit-full-gpl-5.1.aar",
              "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-full-gpl/4.5.1-1/ffmpeg-kit-full-gpl-4.5.1-1.aar",
              "https://web.archive.org/web/2024id_/https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-full-gpl-6.0-2.LTS.aar",
              "https://web.archive.org/web/2024id_/https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-full-gpl-6.0-2.aar",
              "https://web.archive.org/web/2024id_/https://github.com/arthenica/ffmpeg-kit/releases/download/v5.1.LTS/ffmpeg-kit-full-gpl-5.1.LTS.aar",
              "https://web.archive.org/web/2024id_/https://github.com/arthenica/ffmpeg-kit/releases/download/v4.5.1.LTS/ffmpeg-kit-full-gpl-4.5.1-1.LTS.aar",
          ]

          # Also query Maven Central Search API for any published ffmpeg-kit-full-gpl artifacts
          try:
              req = urllib.request.urlopen("https://search.maven.org/solrsearch/select?q=a:ffmpeg-kit-full-gpl&rows=20&wt=json", timeout=15)
              data = json.loads(req.read().decode())
              for doc in data.get("response", {}).get("docs", []):
                  g = doc["g"].replace(".", "/")
                  a = doc["a"]
                  v = doc["latestVersion"]
                  candidate = f"https://repo1.maven.org/maven2/{g}/{a}/{v}/{a}-{v}.aar"
                  if candidate not in urls:
                      urls.insert(0, candidate)
          except Exception as e:
              print(f"Maven search query skipped: {e}")

          target = "app/libs/ffmpeg-kit-full-gpl.aar"
          for url in urls:
              print(f"Trying: {url}")
              res = subprocess.run(["curl", "-fL", "--connect-timeout", "15", "--max-time", "180", url, "-o", target])
              if res.returncode == 0 and os.path.exists(target) and os.path.getsize(target) > 15_000_000:
                  check = subprocess.run(["unzip", "-l", target], capture_output=True, text=True)
                  if "libffmpegkit.so" in check.stdout:
                      print(f"SUCCESS: Downloaded valid AAR ({os.path.getsize(target)} bytes) with native .so libraries from {url}")
                      raise SystemExit(0)
              if os.path.exists(target):
                  os.remove(target)

          print("ERROR: Failed to download valid ffmpeg-kit-full-gpl.aar from any mirror.")
          raise SystemExit(1)
          EOF

      - name: Build assembleRelease
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error